
<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: #061326; color: #ffffff; padding: 60px; display: flex; flex-direction: column; align-items: center; justify-content: center; width: 1440px; height: 900px; }
    .header { text-align: center; margin-bottom: 40px; }
    .badge { display: inline-block; padding: 4px 12px; background: rgba(239,68,68,0.2); border: 1px solid #ef4444; border-radius: 20px; font-size: 12px; font-weight: 700; color: #ef4444; text-transform: uppercase; letter-spacing: 0.1em; margin-bottom: 12px; }
    h2 { font-size: 32px; font-weight: 800; letter-spacing: -0.02em; }
    p { font-size: 15px; color: #94a3b8; margin-top: 6px; }
    .phones { display: flex; gap: 36px; align-items: center; justify-content: center; }
    .phone-frame { width: 340px; height: 600px; background: #000000; border: 8px solid #1e293b; border-radius: 36px; overflow: hidden; box-shadow: 0 25px 50px -12px rgba(0,0,0,0.7), 0 0 30px rgba(14,165,233,0.15); display: flex; flex-direction: column; position: relative; }
    .notch { width: 120px; height: 18px; background: #1e293b; border-bottom-left-radius: 12px; border-bottom-right-radius: 12px; position: absolute; top: 0; left: 50%; transform: translateX(-50%); z-index: 10; }
    .screen { width: 100%; height: 100%; overflow: hidden; }
    .screen img { width: 100%; height: auto; display: block; }
    .label { text-align: center; margin-top: 14px; font-size: 13px; font-weight: 600; color: #cbd5e1; }
  </style>
</head>
<body>
  <div class="header">
    <div class="badge">Mobile Responsiveness</div>
    <h2>Engineered for Fast, Flawless Mobile Advisory</h2>
    <p>Zero Layout Shift (CLS 0) • Responsive Image Optimization • Touch-Optimized UX</p>
  </div>
  <div class="phones">
    <div>
      <div class="phone-frame">
        <div class="notch"></div>
        <div class="screen"><img src="../mobile/homepage.png" /></div>
      </div>
      <div class="label">Homepage Experience</div>
    </div>
    <div>
      <div class="phone-frame" style="transform: scale(1.04); border-color: #334155;">
        <div class="notch"></div>
        <div class="screen"><img src="../mobile/services-marine-aviation.png" /></div>
      </div>
      <div class="label">Specialist Marine & Aviation</div>
    </div>
    <div>
      <div class="phone-frame">
        <div class="notch"></div>
        <div class="screen"><img src="../mobile/request-quote.png" /></div>
      </div>
      <div class="label">Interactive Quote Flow</div>
    </div>
  </div>
</body>
</html>
