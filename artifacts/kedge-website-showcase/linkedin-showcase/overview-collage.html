
<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: #061326; color: #ffffff; padding: 48px; width: 1440px; height: 900px; display: flex; flex-direction: column; justify-content: space-between; }
    .header { display: flex; justify-content: space-between; align-items: flex-start; border-bottom: 2px solid #1e293b; padding-bottom: 20px; }
    .header h2 { font-size: 28px; font-weight: 800; letter-spacing: -0.02em; }
    .header h2 span { color: #ef4444; }
    .header p { font-size: 14px; color: #94a3b8; margin-top: 4px; }
    .collage { display: grid; grid-template-columns: 1.4fr 1fr 1fr; gap: 20px; height: 680px; margin-top: 24px; }
    .main-feature { background: #0b1f3a; border: 1px solid #1e3a5f; border-radius: 12px; overflow: hidden; box-shadow: 0 15px 35px rgba(0,0,0,0.6); display: flex; flex-direction: column; }
    .main-feature img { width: 100%; height: auto; display: block; object-fit: cover; object-position: top; }
    .column { display: flex; flex-direction: column; gap: 20px; }
    .sub-feature { flex: 1; background: #0b1f3a; border: 1px solid #1e3a5f; border-radius: 12px; overflow: hidden; box-shadow: 0 10px 25px rgba(0,0,0,0.5); }
    .sub-feature img { width: 100%; height: auto; display: block; object-fit: cover; object-position: top; }
  </style>
</head>
<body>
  <div class="header">
    <div>
      <h2><span>KEDGE</span> Insurance Brokers Ltd — Corporate Website Suite</h2>
      <p>Enterprise Risk Advisory • Licensed Brokerage • 22 Integrated Digital Touchpoints</p>
    </div>
    <div style="text-align: right; font-size: 12px; color: #cbd5e1;">
      <strong>www.kedgeinsure.com.ng</strong><br>
      Full Architecture Overview
    </div>
  </div>
  <div class="collage">
    <div class="main-feature">
      <img src="../desktop/homepage.png" />
    </div>
    <div class="column">
      <div class="sub-feature"><img src="../desktop/about-us.png" /></div>
      <div class="sub-feature"><img src="../desktop/services-marine-aviation.png" /></div>
    </div>
    <div class="column">
      <div class="sub-feature"><img src="../desktop/coverage-matrix.png" /></div>
      <div class="sub-feature"><img src="../desktop/request-quote.png" /></div>
    </div>
  </div>
</body>
</html>
